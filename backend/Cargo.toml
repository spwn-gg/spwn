[package]
name = "spwn"
version = "0.1.1"
description = "CLI + web server for managing Claude Code sessions"
authors = ["Mark Barta"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spwn_lib"
crate-type = ["rlib"]

[[bin]]
name = "spwn"
path = "src/main.rs"

[dependencies]
# Web server: HTTP routes + WebSocket, over the existing tokio runtime.
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Embed the built SPA into the binary so `spwn` is a single distributable.
rust-embed = "8"
mime_guess = "2"
# CLI parsing + opening the browser.
clap = { version = "4", features = ["derive"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Agent definitions are hand-edited config, so TOML over JSON: comments survive,
# which matters when every detect pattern needs a note saying why it's shaped that way.
toml = "0.8"
# Detect rules need real patterns, not just substrings — e.g. Claude's "a turn is
# running" spinner has a randomized verb, so only its structure is stable.
regex = "1"
# Filesystem watching for the project/session navigation tree.
notify = "6"
notify-debouncer-full = "0.3"
# Locating ~/.claude and the user's home dir portably.
directories = "5"
# Async runtime + concurrency primitives.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
# Non-poisoning mutexes: a panic while holding a lock won't brick every later command.
parking_lot = "0.12"
# Stable ids for ptys/panes.
uuid = { version = "1", features = ["v4"] }
# Ergonomic error handling.
anyhow = "1"
thiserror = "1"
# Local time / weekday math for the daily/weekly task scheduler.
chrono = { version = "0.4", features = ["clock"] }
# Encode raw pty bytes for IPC (avoids corrupting UTF-8 split across read chunks).
base64 = "0.22"
# rmux: programmable terminal multiplexer SDK. Backs claude sessions with
# persistent sessions + structured snapshots/wait_for_text for rewind/branch.
rmux-sdk = "0.6"
# Split a hook-reported exec prefix into argv the way a shell would. Panes are
# launched exec-style (no shell), so a worktree path containing a space has to
# survive as ONE argument — naive whitespace splitting silently shreds it.
shell-words = "1"

[dev-dependencies]
# The M0 rewind/branch risk-spike harness drives a real `claude` over a pty.
tempfile = "3"
portable-pty = "0.8"
