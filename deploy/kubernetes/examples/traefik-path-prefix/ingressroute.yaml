# spwn's server routes stay at `/`; strip the prefix before it reaches the pod.
# The UI needs no configuration for this: it loads its assets relative to the page
# and resolves /api and /ws from where it was served.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spwn
spec:
  entryPoints: [web]
  routes:
    # Not a bare PathPrefix(`/spwn`): that is a string prefix and would also match
    # /spwn-anything.
    - match: Path(`/spwn`) || PathPrefix(`/spwn/`)
      kind: Rule
      middlewares:
        - name: strip-spwn-prefix
      services:
        - name: spwn
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-spwn-prefix
spec:
  stripPrefix:
    prefixes: ["/spwn"]
