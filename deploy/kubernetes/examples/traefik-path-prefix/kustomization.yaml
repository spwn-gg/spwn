# spwn under a path prefix (/spwn) on a shared host, through Traefik.
#
#   kubectl apply -k deploy/kubernetes/examples/traefik-path-prefix
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spwn
resources:
  - namespace.yaml
  - ../../base
  - ingressroute.yaml
# Repo hooks here create a container per session and hand it back to spwn as an
# `exec` prefix, which needs the Kubernetes API. Drop this line to deploy spwn
# with no cluster permissions at all.
components:
  - ../../components/session-pods
