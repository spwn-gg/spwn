# spwn's whole home dir: repos you clone (e.g. ~/code), the Claude login
# (~/.claude, ~/.claude.json), agent and hook definitions (~/.spwn), and the project
# store (~/.local/share/com.markbarta.spwn).
#
# Uses the cluster's default StorageClass. Check its reclaim policy: with Delete,
# removing this claim removes the workspace and the login with it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spwn-home
  labels:
    app.kubernetes.io/name: spwn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
