# spwn's own identity in the cluster.
#
# It holds NO permissions on its own -- the base deliberately grants none, so a
# default install can do nothing to the cluster. A hook that needs the Kubernetes
# API (to build a session a container of its own, say) gets its rights from an
# overlay: see ../components/session-pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spwn
  labels:
    app.kubernetes.io/name: spwn
