# spwn as a single-replica Deployment with a persistent home volume and a
# ClusterIP Service. No namespace and no Ingress: pick those in an overlay (see
# ../examples) so the base fits any cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
