# Lets spwn's hooks run a session somewhere else -- specifically, in a pod of its
# own in spwn's namespace.
#
#   components:
#     - ../../components/session-pods
#
# Add it when a repo's `session-created` hook creates a container and reports an
# `exec` prefix back (see the Hooks reference, "Running a session somewhere
# else"). Without it spwn's ServiceAccount can do nothing at all, which is the
# right default: most deployments never need the Kubernetes API.
#
# A session pod mounts spwn's home volume so the worktree keeps the SAME ABSOLUTE
# PATH it has in the spwn pod. That volume is namespaced and usually
# ReadWriteOnce, which is why this is scoped to spwn's own namespace and why a
# session pod belongs on spwn's node.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - rbac.yaml
