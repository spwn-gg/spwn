{{- if .Values.serviceAccount.create }}
# spwn's own identity in the cluster.
#
# It holds NO permissions on its own -- the chart deliberately grants none, so a default
# install can do nothing to the cluster. A hook that needs the Kubernetes API (to give a
# session a container of its own, say) gets its rights from `sessionPods.enabled`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spwn.serviceAccountName" . }}
  labels:
    {{- include "spwn.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
