{{- if .Values.sessionPods.enabled }}
# Lets spwn's hooks run a session somewhere else -- specifically, in a pod of its own in
# spwn's namespace. Add it when a repo's `session-created` hook creates a container and
# reports an `exec` prefix back (see the Hooks reference, "Running a session somewhere
# else"). Without it spwn's ServiceAccount can do nothing at all, which is the right
# default: most deployments never need the Kubernetes API.
#
# Namespace-scoped and nothing more. spwn can manage pods in its own namespace and exec
# into them; it cannot touch Deployments, Secrets, ServiceAccounts, RBAC, or anything at
# all in another namespace.
#
# This is still a real grant: `pods/exec` on a pod that mounts spwn's home volume is
# equivalent to running code in spwn's pod. That is already what spwn does -- it opens
# shells and runs agents there -- so it widens nothing, but it is worth knowing before
# adding this to a namespace that holds anything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "spwn.fullname" . }}-session-pods
  labels:
    {{- include "spwn.labels" . | nindent 4 }}
rules:
  # `get` on its own pod is how a hook discovers the node to pin a session pod to and
  # the claim to mount: a session pod that landed on another node would never bind a
  # ReadWriteOnce home volume.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # Reading logs is what makes a session container that failed to start diagnosable from
  # the Hooks panel instead of only with cluster access.
  - apiGroups: [""]
    resources: [pods/log, pods/status]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "spwn.fullname" . }}-session-pods
  labels:
    {{- include "spwn.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "spwn.fullname" . }}-session-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "spwn.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
